name: Install pnpm dependencies
description: Reusable action to install pnpm dependencies

runs:
  using: composite
  steps:
    - name: Set up Git to use HTTPS
      shell: bash
      run: |
        git config --global url."https://github.com/".insteadOf "git@github.com:"

    # No version here: the action reads packageManager in package.json, the
    # same pnpm the Dockerfile installs. v6 is the first release with pnpm 11.
    - name: Install pnpm
      uses: pnpm/action-setup@v6
      with:
        run_install: false

    - name: Install Node.js
      uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        check-latest: true
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
