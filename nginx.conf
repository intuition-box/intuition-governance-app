# The static export, as `pnpm --filter dao-ui build` writes it to
# packages/ui/out. With trailingSlash, a route is a folder with an
# index.html: /setup/ serves setup/index.html, and /setup redirects to
# /setup/, as an IPFS gateway does.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Headers and error pages leave out the nginx version.
  server_tokens off;

  # Behind a reverse proxy, a redirect must not name this container's own
  # host and port.
  absolute_redirect off;

  gzip on;
  gzip_types text/plain text/css text/javascript application/javascript
    application/json image/svg+xml;

  # Pages are checked again on every visit: a page cached from an earlier
  # deploy names scripts the new one no longer has.
  location / {
    add_header Cache-Control "no-cache";
  }

  # Next's built assets carry a hash in their names, so they never change.
  location /_next/static/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # A folder with no page (/plugins/) answers 404 too, rather than 403.
  error_page 403 404 =404 /404.html;
}
